name: Build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVONOX_BUILD_PLUGIN=ON -DVONOX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Tests (DSP, engine, chain, plugin smoke)
        run: ctest --test-dir build --output-on-failure
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVst3Dir=$PWD\build\plugin\VONOX_artefacts\Release\VST3\VONOX.vst3" installer\vonox.iss
      - uses: actions/upload-artifact@v4
        with: { name: VONOX-VST3-windows, path: build/plugin/VONOX_artefacts/Release/VST3/VONOX.vst3 }
      - uses: actions/upload-artifact@v4
        with: { name: VONOX-Setup, path: installer/Output/VONOX-Setup.exe }
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVONOX_BUILD_PLUGIN=ON -DVONOX_BUILD_TESTS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
